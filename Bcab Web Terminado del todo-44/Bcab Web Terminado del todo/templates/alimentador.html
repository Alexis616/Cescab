<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Procesar CSVs</title>
    <link rel="stylesheet" href="../static/CSS/alimentador.css">
    
</head>
<a class="alimentadores" href="/alimentador_fichas"> Alimentar fichas </a>
<hr>
<a class="alimentadores" href="/alimentador_aprendices"> Alimentar aprendices </a>

<body>
    <h2>Procesar CSVs</h2>
    

    <form method="POST" enctype="multipart/form-data">
        <label for="total_cols">Número total de columnas en cada CSV:</label><br>
        <input type="number" id="total_cols" name="total_cols" min="1" required><br><br>

        <label for="tabla">Nombre de la tabla en la base de datos:</label><br>
        <select name="tabla" id="tabla" required>
            <option value="aprendices">aprendices</option>
            <option value="comites">comites</option>
            <option value="fichas">fichas</option>
            <option value="juicios_evaluativos">juicios_evaluativos</option>
            <option value="usuarios">usuarios</option>
        </select><br><br>

        <label>Asociar columna CSV con campo BD:</label><br>
        <div id="mapeo-container">
            <div id="contenedor-filas"></div>
        </div><br>

        <input type="hidden" name="columnas" id="columnas-hidden">
        <button type="button" onclick="agregarFila()">Agregar Fila Manual</button><br><br>

        <label for="file">Subir archivos CSV:</label><br>
        <input type="file" name="file" accept=".csv" multiple required><br><br>

        <button type="submit">Procesar Archivos</button>
    </form>

    <script src="/static/javaScript/alimentador.js"></script><div id="firmaDesarrolladores" style="display: none;" class="firma">
        <h4>Análisis y Desarrollo de Software</h4>
        <p>Andrés Felipe Arce Escobar</p>
        <p>Wilmer Alexis Montoya Naranjo</p>
        <img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png" alt="Icono programación" class="icono-programacion">
    </div>
    
    <button id="btnFirma" class="boton-firma"> ◀ / ▶ </button>
    
    
    <style>
      .firma {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background-color: #f4f4f4;
    border: 1px solid #ccc;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
    text-align: center;
    font-family: 'Segoe UI', sans-serif;
    z-index: 100;
    }
    
    .firma h4 {
    margin: 5px 0;
    font-weight: bold;
    }
    
    .firma p {
    margin: 2px 0;
    font-size: 14px;
    }
    
    .icono-programacion {
    width: 30px;
    height: 30px;
    margin-top: 8px;
    }
    
    .boton-firma {
    position: fixed;
    bottom: 10px;
    left: 10px;
    padding: 8px 12px;
    background-color: #00324D;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    z-index: 100;
    width: 5%;
    }
    
    .boton-firma:hover {
    background-color: #0056b3;
    }
    
    </style>
    
    <script>
    const btnFirma = document.getElementById('btnFirma');
    const firma = document.getElementById('firmaDesarrolladores');
    
    btnFirma.addEventListener('click', function () {
    const visible = firma.style.display === 'block';
    firma.style.display = visible ? 'none' : 'block';
    btnFirma.textContent = visible ? '</>' : 'Ocultar';
    });
    </script>

    
</body>

</html>
